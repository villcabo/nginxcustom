# OpenResty API Gateway — main configuration (owned by the image).
#
# Do not mount over this file. Routes, upstreams and health checks belong in
# /etc/nginx/conf.d/ (see conf/examples/), which is watched and hot-reloaded.

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  65s;
    keepalive_requests 1000;
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          30s;
    reset_timedout_connection on;

    # Do not advertise the server software or version.
    server_tokens off;
    more_clear_headers Server;
    more_set_headers "X-Content-Type-Options: nosniff";

    # Runtime values rendered by entrypoint.sh from env vars
    # (resolver, real_ip, client_max_body_size).
    include gateway/runtime.conf;

    # ------------------------------------------------------------------
    # Request correlation: keep the caller's X-Request-ID or mint one.
    # ------------------------------------------------------------------
    map $http_x_request_id $gateway_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    more_set_headers "X-Request-ID: $gateway_request_id";

    # WebSocket-aware Connection header that still allows upstream keepalive.
    map $http_upgrade $gateway_connection {
        default upgrade;
        ""      "";
    }

    # ------------------------------------------------------------------
    # Structured access log — one JSON object per line.
    # ------------------------------------------------------------------
    log_format gateway_json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$gateway_request_id",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream":"$proxy_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    access_log /var/log/nginx/access.log gateway_json buffer=64k flush=1s;

    # ------------------------------------------------------------------
    # Proxy defaults, inherited by every location that does not override them.
    # A location that sets ANY proxy_set_header loses these headers —
    # include snippets/proxy-headers.conf there to get them back.
    # ------------------------------------------------------------------
    proxy_http_version 1.1;
    include snippets/proxy-headers.conf;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Retry on another peer only for connection-level failures. Non-idempotent
    # requests (POST, PATCH) are never retried unless a location opts in.
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   3;
    proxy_next_upstream_timeout 15s;

    proxy_buffer_size 16k;
    proxy_buffers     16 16k;

    # ------------------------------------------------------------------
    # Compression (skipped automatically when the upstream already encoded).
    # ------------------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/problem+json application/javascript
               application/xml text/plain text/css text/xml image/svg+xml;

    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1024;
    brotli_types application/json application/problem+json application/javascript
                 application/xml text/plain text/css text/xml image/svg+xml;

    # ------------------------------------------------------------------
    # Rate limiting zones, opt-in per location:
    #   limit_req  zone=per_ip burst=100 nodelay;
    #   limit_conn conn_per_ip 50;
    # Define your own zones in conf.d for per-route or per-key limits.
    # ------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=per_ip:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ------------------------------------------------------------------
    # Lua: active health checks + Prometheus metrics.
    # The gateway owns init_worker and log phases at this level; do not
    # declare init_worker_by_lua_* in conf.d.
    # ------------------------------------------------------------------
    lua_shared_dict healthcheck        4m;
    lua_shared_dict prometheus_metrics 16m;
    lua_socket_log_errors off;

    init_worker_by_lua_block {
        require("gateway.metrics").init()
        require("gateway.healthchecks").spawn("/etc/nginx/conf.d/healthchecks.json")
    }

    log_by_lua_block {
        require("gateway.metrics").log()
    }

    # ------------------------------------------------------------------
    # Internal status port — never publish it to the internet.
    # ------------------------------------------------------------------
    server {
        listen 8081;
        server_name _;
        access_log off;

        # Scrapes and probes must not show up in the gateway metrics.
        log_by_lua_block { }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /status/upstreams {
            default_type text/plain;
            content_by_lua_block {
                ngx.print(require("resty.upstream.healthcheck").status_page())
            }
        }

        location = /metrics {
            default_type text/plain;
            content_by_lua_block {
                require("gateway.metrics").collect()
            }
        }

        location = /nginx_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    # User routes, upstreams and extra zones.
    include /etc/nginx/conf.d/*.conf;
}
