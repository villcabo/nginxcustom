# OpenResty API Gateway — main configuration (owned by the image).
#
# Do not mount over this file. Routes, upstreams and health checks belong in
# /etc/nginx/conf.d/. The entrypoint validates that directory and publishes it
# as conf/routes/ (the last known-good snapshot), which is what gets loaded.

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

# worker_processes and worker_shutdown_timeout, rendered from env and the
# container CPU limit by entrypoint.sh.
include gateway/main.conf;

worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;
error_log stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # The nginx prefix is read-only for the runtime user; buffers go here.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  65s;
    keepalive_requests 1000;
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          30s;
    reset_timedout_connection on;

    # Do not advertise the server software or version.
    server_tokens off;
    more_clear_headers Server;
    more_set_headers "X-Content-Type-Options: nosniff";

    # Rendered by entrypoint.sh from env vars: resolver, body size, trusted
    # proxies and the $gateway_forwarded_* variables, optional stdout access log.
    include gateway/runtime.conf;

    # ------------------------------------------------------------------
    # Request correlation: keep the caller's X-Request-ID when it is a sane
    # token, otherwise mint one so a client cannot inject arbitrary values.
    # ------------------------------------------------------------------
    map $http_x_request_id $gateway_request_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
        default                     $request_id;
    }
    more_set_headers "X-Request-ID: $gateway_request_id";

    # WebSocket-aware Connection header that still allows upstream keepalive.
    map $http_upgrade $gateway_connection {
        default upgrade;
        ""      "";
    }

    # ------------------------------------------------------------------
    # Structured access log — one JSON object per line.
    # ------------------------------------------------------------------
    log_format gateway_json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$gateway_request_id",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream":"$proxy_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    access_log /var/log/nginx/access.log gateway_json buffer=64k flush=1s;
    access_log /dev/stdout gateway_json if=$gateway_log_stdout;

    # ------------------------------------------------------------------
    # Proxy defaults, inherited by every location that does not override them.
    # A location that sets ANY proxy_set_header loses these headers —
    # include snippets/proxy-headers.conf there to get them back.
    # ------------------------------------------------------------------
    proxy_http_version 1.1;
    include snippets/proxy-headers.conf;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Retry on another peer only when the request never reached a working
    # backend. 503 is excluded on purpose: it usually means "overloaded", and
    # retrying multiplies the load on a pool that is already struggling.
    # Non-idempotent requests (POST, PATCH) are never retried unless a
    # location opts in with `non_idempotent`.
    proxy_next_upstream         error timeout http_502 http_504;
    proxy_next_upstream_tries   2;
    proxy_next_upstream_timeout 10s;

    proxy_buffer_size 16k;
    proxy_buffers     16 16k;

    # HTTPS upstreams are verified against the system CA bundle. For a private
    # CA, override proxy_ssl_trusted_certificate in the location.
    proxy_ssl_server_name         on;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # ------------------------------------------------------------------
    # Compression (skipped automatically when the upstream already encoded).
    # ------------------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/problem+json application/javascript
               application/xml text/plain text/css text/xml image/svg+xml;

    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1024;
    brotli_types application/json application/problem+json application/javascript
                 application/xml text/plain text/css text/xml image/svg+xml;

    # ------------------------------------------------------------------
    # Rate limiting zones, opt-in per location:
    #   limit_req  zone=per_ip burst=100 nodelay;
    #   limit_conn conn_per_ip 50;
    # Behind a load balancer, set GATEWAY_REAL_IP_FROM or every client shares
    # the balancer's address and these limits become global.
    # ------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=per_ip:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ------------------------------------------------------------------
    # Lua: active health checks + Prometheus metrics.
    # The gateway owns init_worker and log phases at this level; do not
    # declare init_worker_by_lua_* in conf.d.
    # ------------------------------------------------------------------
    lua_shared_dict healthcheck        4m;
    lua_shared_dict prometheus_metrics 16m;
    lua_socket_log_errors off;

    init_worker_by_lua_block {
        require("gateway.metrics").init()
        require("gateway.healthchecks").spawn("/usr/local/openresty/nginx/conf/routes/healthchecks.json")
    }

    log_by_lua_block {
        require("gateway.metrics").log()
    }

    # ------------------------------------------------------------------
    # Internal status port. Restricted to GATEWAY_STATUS_ALLOW; still, never
    # publish it to the internet.
    # ------------------------------------------------------------------
    server {
        listen 8081;
        server_name _;
        access_log off;

        include gateway/status-allow.conf;

        # Scrapes and probes must not show up in the gateway metrics.
        log_by_lua_block { }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /status/config {
            default_type application/json;
            content_by_lua_block {
                ngx.print(require("gateway.status").read_raw())
            }
        }

        location = /status/upstreams {
            default_type text/plain;
            content_by_lua_block {
                ngx.print(require("resty.upstream.healthcheck").status_page())
            }
        }

        location = /metrics {
            default_type text/plain;
            content_by_lua_block {
                require("gateway.metrics").collect()
            }
        }

        location = /nginx_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    # User routes: the validated snapshot of /etc/nginx/conf.d.
    include routes/*.conf;
}
