# Catch-all for requests whose Host matches no server_name.
# This directory is meant to be replaced by a mount with your own routes;
# see /usr/local/openresty/nginx/conf/examples/ for a starting point.
server {
    listen 8080 default_server;
    server_name _;

    include snippets/json-errors.conf;

    location / {
        return 404;
    }
}
