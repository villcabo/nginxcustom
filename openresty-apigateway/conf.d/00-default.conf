# Catch-all for requests whose Host matches no server_name. On 443 it rejects
# the TLS handshake for unknown names instead of needing a certificate.
# This directory is meant to be replaced by a mount with your own routes;
# see /usr/local/openresty/nginx/conf/examples/ for a starting point.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;

    include snippets/json-errors.conf;

    location / {
        return 404;
    }
}
