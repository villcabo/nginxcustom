# OpenResty API Gateway — example configuration
#
# This file is shipped at /usr/local/openresty/nginx/conf/conf.d/apigateway-example.conf
# but is NOT loaded by default. To enable, ensure your nginx.conf `http {}` block
# includes it (e.g. via `include conf.d/apigateway-example.conf;`) OR rename it
# without the "-example" suffix if your include glob matches "*.conf".
#
# Demonstrates:
#   - Loading dynamic modules (GeoIP2, Brotli)
#   - Active health check via lua-resty-upstream-healthcheck (Traefik-style)
#   - Rate limiting with limit_req_zone
#   - Aggressive proxy_next_upstream for transparent failover
#
# These directives go OUTSIDE http {} (top-level):
#   load_module modules/ngx_http_geoip2_module.so;
#   load_module modules/ngx_http_brotli_filter_module.so;
#   load_module modules/ngx_http_brotli_static_module.so;
#
# Everything below assumes you are inside the http {} block.

# ---------------------------------------------------------------------------
# Shared memory zones used by Lua and rate limiting
# (Place these at the top of http {})
# ---------------------------------------------------------------------------
# lua_shared_dict healthcheck 1m;
# lua_shared_dict healthcheck_locks 1m;
# limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# ---------------------------------------------------------------------------
# Active health check init (runs once per worker on startup)
# ---------------------------------------------------------------------------
# init_worker_by_lua_block {
#     local hc = require "resty.upstream.healthcheck"
#
#     local ok, err = hc.spawn_checker{
#         shm = "healthcheck",
#         upstream = "backend_api",
#         type = "http",
#         http_req = "GET /health HTTP/1.0\r\nHost: backend\r\n\r\n",
#         interval = 2000,        -- ping every 2s
#         timeout = 1000,         -- 1s timeout per probe
#         fall = 2,               -- 2 consecutive failures => DOWN
#         rise = 2,               -- 2 consecutive successes => UP
#         valid_statuses = {200, 204},
#         concurrency = 5,
#     }
#     if not ok then
#         ngx.log(ngx.ERR, "failed to spawn healthchecker: ", err)
#     end
# }

# ---------------------------------------------------------------------------
# Upstream pool — peers marked DOWN by the active checker are skipped
# automatically. Combined with proxy_next_upstream below, failover is
# imperceptible to the client.
# ---------------------------------------------------------------------------
upstream backend_api {
    server backend1:8080 max_fails=1 fail_timeout=10s;
    server backend2:8080 max_fails=1 fail_timeout=10s;
    server backend3:8080 max_fails=1 fail_timeout=10s;

    keepalive 32;
}

# ---------------------------------------------------------------------------
# Optional: status endpoint for the active health checker
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    # Brotli (only effective if you also load the modules at top-level)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # GeoIP2 example (requires .mmdb mounted in /usr/share/GeoIP/)
    # geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    #     $geoip2_country_code country iso_code;
    # }

    location /healthcheck-status {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        content_by_lua_block {
            local hc = require "resty.upstream.healthcheck"
            ngx.say("Nginx Worker PID: ", ngx.worker.pid())
            ngx.print(hc.status_page())
        }
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;

        proxy_pass http://backend_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggressive timeouts so a dead peer fails fast
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;

        # Transparent failover to the next live peer
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;
    }
}
