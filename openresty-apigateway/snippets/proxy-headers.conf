# Standard upstream headers. Included at http level by nginx.conf; include it
# again in any location that declares its own proxy_set_header.
#
# $gateway_forwarded_for / $gateway_forwarded_proto come from runtime.conf:
# with no trusted proxy (GATEWAY_REAL_IP_FROM empty) the gateway is the edge
# and discards whatever X-Forwarded-* the client sent.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $gateway_forwarded_for;
proxy_set_header X-Forwarded-Proto $gateway_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $gateway_request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $gateway_connection;
