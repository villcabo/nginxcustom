# Standard upstream headers. Included at http level by nginx.conf; include it
# again in any location that declares its own proxy_set_header.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $gateway_request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $gateway_connection;
