# JSON bodies for errors the gateway itself generates (no route, rate limit,
# body too large, upstream unreachable). Upstream error responses pass through
# untouched unless proxy_intercept_errors is enabled. Include inside a server {}.
error_page 400 401 403 404 405 408 413 429 500 502 503 504 /__gateway_error;

location = /__gateway_error {
    internal;
    default_type application/json;
    content_by_lua_block {
        require("gateway.errors").render()
    }
}
