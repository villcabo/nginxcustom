# Example routes for the API gateway. Copy into your conf.d mount and adapt.
# Every *.conf in /etc/nginx/conf.d is validated, published and loaded inside
# http {}; changes are hot-reloaded.

# ---------------------------------------------------------------------------
# Upstreams: ALWAYS declare peers with `resolve` (and a `zone`).
#
# Without it nginx resolves the name once, while loading the config: one
# backend that does not exist yet makes the whole gateway refuse to start or
# reload, and a backend that is recreated with a new IP stays unreachable
# until the next reload. With `resolve` the name is re-read every
# GATEWAY_RESOLVER_VALID and peers follow scaling up and down.
#
# Docker Compose: the service name. Docker Swarm: tasks.<service>.
# Kubernetes: a headless Service.
# ---------------------------------------------------------------------------
upstream orders_api {
    zone orders_api 64k;
    # max_conns is a bulkhead: a slow backend cannot pile up every gateway
    # connection; extra requests fail fast and go to another peer.
    server orders:8080 resolve max_fails=2 fail_timeout=10s max_conns=200;
    keepalive 32;
}

upstream users_api {
    zone users_api 64k;
    server tasks.users:8080 resolve max_fails=2 fail_timeout=10s max_conns=200;
    keepalive 32;
}

# HTTPS backend: verified against the system CA bundle by default
# (proxy_ssl_verify on in nginx.conf).
upstream billing_api {
    zone billing_api 64k;
    server billing.internal.example.com:443 resolve;
    keepalive 16;
}

# Per-consumer limit keyed by API key. Requests without the header fall back
# to the client IP; a bare $http_x_api_key would let them skip the limit,
# because nginx does not account requests whose key is empty.
map $http_x_api_key $api_limit_key {
    ""      $binary_remote_addr;
    default $http_x_api_key;
}
limit_req_zone $api_limit_key zone=per_api_key:10m rate=200r/s;

server {
    listen 80;
    server_name api.example.com;

    include snippets/json-errors.conf;

    # Identity headers are set by the gateway (or an auth layer), never
    # trusted from the client. Clear the ones your services rely on.
    more_clear_input_headers X-User-Id X-User-Roles X-Authenticated-User;

    location /orders/ {
        limit_req zone=per_ip burst=100 nodelay;
        proxy_pass http://orders_api/;
    }

    location /users/ {
        limit_req zone=per_api_key burst=200 nodelay;
        proxy_pass http://users_api/;
        proxy_read_timeout 120s;
    }

    location /billing/ {
        proxy_pass https://billing_api/;
        proxy_ssl_name billing.internal.example.com;
    }

    # Long-lived WebSocket connections: Upgrade/Connection come from the
    # default proxy headers, only the idle timeout needs raising. Note that a
    # graceful stop or reload waits at most GATEWAY_WORKER_SHUTDOWN_TIMEOUT
    # for these connections.
    location /ws/ {
        proxy_pass http://users_api;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Opt in to retrying non-idempotent requests only when the backend is
    # safe to call twice. Adding a header here drops the inherited ones, so
    # the standard set is included again.
    location /payments/ {
        proxy_pass http://orders_api/payments/;
        proxy_next_upstream error timeout non_idempotent;
        include snippets/proxy-headers.conf;
        proxy_set_header X-Gateway-Route payments;
    }
}

