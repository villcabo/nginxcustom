# Example routes for the API gateway. Copy into your conf.d mount and adapt.
# Every *.conf in /etc/nginx/conf.d is loaded inside http {} and hot-reloaded
# on change.

# ---------------------------------------------------------------------------
# Static pool: fixed peers, with active health checks declared in
# healthchecks.json. A peer marked DOWN is skipped before any request reaches it.
# ---------------------------------------------------------------------------
upstream orders_api {
    zone orders_api 64k;
    server orders-1:8080 max_fails=2 fail_timeout=10s;
    server orders-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Dynamic pool: peers follow the DNS record at runtime, so scaling the
# service up or down needs no reload (Traefik-style discovery, without
# talking to the Docker API). Use tasks.<service> on Docker Swarm, the
# service name on Compose, or a headless Service on Kubernetes.
# Requires `zone`; the resolver comes from GATEWAY_RESOLVER or resolv.conf.
# ---------------------------------------------------------------------------
upstream users_api {
    zone users_api 64k;
    server tasks.users:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Per-consumer limit keyed by API key instead of client IP.
limit_req_zone $http_x_api_key zone=per_api_key:10m rate=200r/s;

server {
    listen 8080;
    server_name api.example.com;

    include snippets/json-errors.conf;

    location /orders/ {
        limit_req zone=per_ip burst=100 nodelay;
        proxy_pass http://orders_api/;
    }

    location /users/ {
        limit_req zone=per_api_key burst=200 nodelay;
        proxy_pass http://users_api/;
        proxy_read_timeout 120s;
    }

    # Long-lived WebSocket connections: Upgrade/Connection come from the
    # default proxy headers, only the idle timeout needs raising.
    location /ws/ {
        proxy_pass http://users_api;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Opt in to retrying non-idempotent requests only when the backend is
    # safe to call twice. Adding a header here drops the inherited ones, so
    # the standard set is included again.
    location /payments/ {
        proxy_pass http://orders_api/payments/;
        proxy_next_upstream error timeout non_idempotent;
        include snippets/proxy-headers.conf;
        proxy_set_header X-Gateway-Route payments;
    }
}
