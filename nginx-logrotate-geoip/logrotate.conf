/var/log/nginx/*.log /var/log/nginx/**/*.log /var/log/nginx/*.json /var/log/nginx/**/*.json {
    daily
    maxsize 1G
    missingok
    rotate 180
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d_%s
    notifempty
    create 640 nginx adm
    sharedscripts
    postrotate
        if [ -f /tmp/nginx.pid ]; then
            kill -USR1 `cat /tmp/nginx.pid`
        fi
    endscript
}
