# Full nginx.conf mounted over /usr/local/openresty/nginx/conf/nginx.conf
# for the gateway service in docker-compose.yml.

load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Verbose log so the failover script can correlate which peer answered each request.
    log_format upstream_log '[$time_local] $remote_addr "$request" '
                            'status=$status upstream=$upstream_addr '
                            'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upstream_log;
    error_log  /dev/stderr notice;

    # Shared dicts used by lua-resty-upstream-healthcheck.
    lua_shared_dict healthcheck 1m;
    lua_shared_dict healthcheck_locks 1m;

    upstream backend_api {
        server backend1:8080 max_fails=1 fail_timeout=10s;
        server backend2:8080 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    # One healthchecker per worker. State is shared via the lua_shared_dict.
    init_worker_by_lua_block {
        local hc = require "resty.upstream.healthcheck"

        local ok, err = hc.spawn_checker{
            shm = "healthcheck",
            upstream = "backend_api",
            type = "http",
            http_req = "GET /health HTTP/1.0\r\nHost: backend\r\n\r\n",
            interval = 2000,
            timeout = 1000,
            fall = 2,
            rise = 2,
            valid_statuses = {200, 204},
            concurrency = 5,
        }
        if not ok then
            ngx.log(ngx.ERR, "healthchecker spawn failed: ", err)
        end
    }

    server {
        listen 8080;
        server_name _;

        # Admin: live status of every peer (UP/DOWN, last check, etc.).
        location = /healthcheck-status {
            access_log off;
            default_type text/plain;
            content_by_lua_block {
                local hc = require "resty.upstream.healthcheck"
                ngx.say("Worker PID: ", ngx.worker.pid())
                ngx.print(hc.status_page())
            }
        }

        # Gateway: proxies to the upstream pool. Active checks ensure DOWN peers
        # are skipped before a request even arrives; proxy_next_upstream is the
        # belt-and-suspenders fallback for races (peer dies between probes).
        location / {
            proxy_pass http://backend_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;
            proxy_send_timeout    10s;

            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
