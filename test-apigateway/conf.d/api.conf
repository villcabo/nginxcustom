# Routes mounted at /etc/nginx/conf.d for the test harness.

# Static pool, one service per peer: used by test-failover.sh.
upstream backend_api {
    zone backend_api 64k;
    server backend1:8080 max_fails=1 fail_timeout=10s;
    server backend2:8080 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

# Dynamic pool resolved from DNS: `docker compose up --scale scaled=N`
# changes the peer set without touching the gateway.
upstream scaled_api {
    zone scaled_api 64k;
    server scaled:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name _;

    include snippets/json-errors.conf;

    location /scaled/ {
        proxy_pass http://scaled_api/;
    }

    location /limited/ {
        limit_req zone=per_ip burst=2 nodelay;
        proxy_pass http://backend_api/;
    }

    location / {
        proxy_pass http://backend_api;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }
}
